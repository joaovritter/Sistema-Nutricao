<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<body>

<!-- Navegação principal. `atual` marca o item ativo:
     inicio | visualizar | ficha | refeicoes | alimentos | admin -->
<th:block th:fragment="navbar(atual)">

    <!-- ── Barra superior: marca à esquerda, conta à direita ── -->
    <header class="topo">
        <a href="/dashboard" class="topo-marca">
            <img src="/images/logoNutra.png" alt="Nutra">
        </a>

        <div class="topo-conta">
            <span class="topo-usuario" sec:authorize="isAuthenticated()" sec:authentication="name">usuário</span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="topo-sair" title="Sair" aria-label="Sair">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <path d="M16 17l5-5-5-5"/>
                        <path d="M21 12H9"/>
                    </svg>
                    <span>Sair</span>
                </button>
            </form>
        </div>
    </header>

    <!-- ── Navegação inferior flutuante ────────────────────── -->
    <nav class="navbar-tubo" id="navbarTubo" aria-label="Navegação principal">
        <div class="navbar-pilula">

            <!-- A lâmpada desliza até o item ativo; posição definida no script -->
            <span class="navbar-lampada" aria-hidden="true">
                <span class="lampada-barra">
                    <span class="lampada-brilho brilho-largo"></span>
                    <span class="lampada-brilho brilho-medio"></span>
                    <span class="lampada-brilho brilho-curto"></span>
                </span>
            </span>

            <a href="/dashboard" class="navbar-item"
               th:classappend="${atual == 'inicio'} ? ' ativo'">
                <span class="item-rotulo">Início</span>
                <span class="item-icone">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 10.5 12 3l9 7.5"/>
                        <path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/>
                    </svg>
                </span>
            </a>

            <a href="/visualizar" class="navbar-item"
               th:classappend="${atual == 'visualizar'} ? ' ativo'">
                <span class="item-rotulo">Fichas</span>
                <span class="item-icone">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="5" y="3" width="14" height="18" rx="2"/>
                        <path d="M9 8h6M9 12h6M9 16h3"/>
                    </svg>
                </span>
            </a>

            <a href="/fichatecnica" class="navbar-item"
               th:classappend="${atual == 'ficha'} ? ' ativo'"
               sec:authorize="hasAnyAuthority('NUTRICIONISTA', 'ADMIN', 'ESTUDANTE')">
                <span class="item-rotulo">Criar</span>
                <span class="item-icone">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </span>
            </a>

            <a href="/refeicoes" class="navbar-item"
               th:classappend="${atual == 'refeicoes'} ? ' ativo'">
                <span class="item-rotulo">Refeições</span>
                <span class="item-icone">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 11h18a9 9 0 0 1-9 8 9 9 0 0 1-9-8Z"/>
                        <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
                    </svg>
                </span>
            </a>

            <a href="/alimentos" class="navbar-item"
               th:classappend="${atual == 'alimentos'} ? ' ativo'">
                <span class="item-rotulo">Alimentos</span>
                <span class="item-icone">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 4c-10 0-16 6-16 14 0 1 .5 2 2 2 8 0 14-6 14-16 0 0 0 0 0 0Z"/>
                        <path d="M8 20c2-6 6-10 12-12"/>
                    </svg>
                </span>
            </a>

            <a href="/admin/usuarios" class="navbar-item"
               th:classappend="${atual == 'admin'} ? ' ativo'"
               sec:authorize="hasAuthority('ADMIN')">
                <span class="item-rotulo">Usuários</span>
                <span class="item-icone">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M19 8v6M22 11h-6"/>
                    </svg>
                </span>
            </a>

        </div>
    </nav>

    <!-- Sem defer e logo após a nav: a lâmpada precisa estar posicionada
         antes do primeiro quadro, senão pisca no canto esquerdo. -->
    <script src="/js/navbar-tubo.js"></script>
</th:block>

</body>
</html>
