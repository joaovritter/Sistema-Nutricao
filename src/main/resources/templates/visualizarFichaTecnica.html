<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar Fichas Técnicas</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/visualizarFichaTecnica.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/animacoes.css">
    <link rel="stylesheet" href="/css/tema.css">
    <script src="/js/animacoes.js" defer></script>
</head>

<body>
<div class="app-shell">

<div th:replace="~{fragments/sidebar :: sidebar('visualizar')}"></div>

<div class="main-area">
<main class="container page-anim">
    <div class="receita-list-section">
        <h2>Receitas Cadastradas</h2>

        <!-- Tabela sempre visível — mensagem embutida quando vazia -->
        <div class="receitas-table-container">
            <table>
                <thead>
                <tr>
                    <th>Nome da Receita</th>
                    <th>Categoria</th>
                    <th>Nutricionista</th>
                    <th>Tempo de Preparo (min)</th>
                    <th>Porções</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <!-- Linha de aviso quando não há receitas -->
                <tr th:if="${receitas == null or receitas.isEmpty()}">
                    <td colspan="6" style="text-align:center; padding:24px; color:#6b7280;">
                        Nenhuma ficha técnica cadastrada ainda.
                        <a th:href="@{/fichatecnica}"
                           sec:authorize="hasAnyAuthority('NUTRICIONISTA', 'ADMIN')"
                           style="color:#059669; font-weight:600;">Crie uma agora!</a>
                    </td>
                </tr>
                <!-- Linhas das receitas -->
                <tr th:each="receita : ${receitas}">
                    <td th:text="${receita.nome}">Nome</td>
                    <td th:text="${receita.categoria}">Categoria</td>
                    <td th:text="${receita.nutricionista != null ? receita.nutricionista.username : 'N/A'}">Nutricionista</td>
                    <td th:text="${receita.tempoPreparo != null ? receita.tempoPreparo + ' min' : '—'}">—</td>
                    <td th:text="${receita.numeroPorcoes != null ? receita.numeroPorcoes : '—'}">—</td>
                    <td>
                        <!-- Botão VISUALIZAR — abre detalhesReceita.html -->
                        <a th:href="@{/receita/detalhes/{id}(id=${receita.id})}"
                           class="btn btn-detalhes">Visualizar</a>

                        <!-- Botão EDITAR — só para nutricionista/admin -->
                        <a th:href="@{/receita/editar/{id}(id=${receita.id})}"
                           class="btn btn-editar"
                           sec:authorize="hasAnyAuthority('NUTRICIONISTA', 'ADMIN')">Editar</a>

                        <!-- Botão EXCLUIR — só para admin -->
                        <form th:action="@{/receita/excluir/{id}(id=${receita.id})}"
                              method="post" style="display:inline;"
                              sec:authorize="hasAnyAuthority('ADMIN')">
                            <button type="submit" class="btn btn-excluir"
                                    title="Excluir ficha" aria-label="Excluir ficha"
                                    onclick="return confirm('Tem certeza que deseja excluir esta ficha?')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M3 6h18"/>
                                    <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/>
                                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                                    <path d="M10 11v6M14 11v6"/>
                                </svg>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</div>

</div>
</body>
</html>
