# ─── Profile ativado quando SPRING_PROFILES_ACTIVE=docker ───────────────────
# As variáveis de ambiente são injetadas pelo docker-compose.yml

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nutricao}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:www.com.brj}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# update: cria/atualiza tabelas sem apagar dados (ao contrário de create-drop)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=8080

# Desativa logs verbosos de debug em produção
logging.level.org.hibernate.SQL=WARN
logging.level.com.mjwsolucoes=INFO
debug=false
